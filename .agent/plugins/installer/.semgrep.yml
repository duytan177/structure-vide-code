rules:
  - id: hardcoded-secret-detection
    pattern-regex: '(?i)(api_key|secret_key|private_key|password)\s*=\s*["''][A-Za-z0-9/\+=]{12,}["'']'
    message: "Phát hiện có Secret Key hoặc Password bị hardcode trong mã nguồn!"
    severity: ERROR
    languages: [js, ts, python, php, ruby, go]

  - id: no-console-log-in-prod
    pattern: console.log(...)
    message: "Không nên sử dụng console.log() trong mã nguồn sản phẩm. Sử dụng Logger chuyên dụng."
    severity: WARNING
    languages: [js, ts]
