name: CI — Self Validation & AI Review (Bước 8-9)

# Tự động chạy Lint + Typecheck + Test + Security Scan cho mọi PR / push.
# LƯU Ý: source dự án nằm trong workspace/ và bị gitignore → CI của BASE không thấy code đó.
#   • Mỗi dự án trong workspace/ là repo độc lập, dùng CI riêng của nó (có thể copy file này làm mẫu).
#   • CI này chủ yếu validate bản thân base + Semgrep quét những gì được track.
# Các step Node được bảo vệ bằng điều kiện: chỉ chạy khi có package.json.

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  validate-skills:
    name: Validate Agent Skills (SKILL.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SKILL.md frontmatter (chuẩn agentskills.io)
        run: bash .agent/scripts/validate-skills.sh

  self-validation:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Node project
        id: detect
        run: |
          if [ -f package.json ]; then echo "node=true" >> "$GITHUB_OUTPUT"; else echo "node=false" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Node
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        if: steps.detect.outputs.node == 'true'
        run: npm ci || npm install

      - name: Lint
        if: steps.detect.outputs.node == 'true'
        run: npm run lint --if-present

      - name: Typecheck
        if: steps.detect.outputs.node == 'true'
        run: npm run typecheck --if-present

      - name: Unit tests
        if: steps.detect.outputs.node == 'true'
        run: npm test --if-present

      - name: No stack yet
        if: steps.detect.outputs.node == 'false'
        run: echo "⚠️ Chưa có package.json — bỏ qua lint/test. Cập nhật workflow khi đã chọn stack."

  security-scan:
    name: Semgrep (OWASP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            .semgrep.yml
        continue-on-error: true
